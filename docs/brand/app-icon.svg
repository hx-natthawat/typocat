<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>TypoCat app icon</title>
  <defs>
    <radialGradient id="plate" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#22B3A8"/><stop offset="0.6" stop-color="#0B7A75"/><stop offset="1" stop-color="#065652"/>
    </radialGradient>
    <radialGradient id="fur" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.65" stop-color="#F6F8F7"/><stop offset="1" stop-color="#C9D6D2"/>
    </radialGradient>
    <radialGradient id="earFur" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3DEDA"/>
    </radialGradient>
    <linearGradient id="earIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59AA0"/><stop offset="1" stop-color="#FFD0CC"/>
    </linearGradient>
    <radialGradient id="irisL" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#7FE3D6"/><stop offset="0.55" stop-color="#14968D"/><stop offset="1" stop-color="#075C57"/>
    </radialGradient>
    <radialGradient id="irisR" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#FFE29A"/><stop offset="0.55" stop-color="#F2A12B"/><stop offset="1" stop-color="#B86E0C"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8F9A" stop-opacity=".75"/><stop offset="1" stop-color="#FF8F9A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA3AE"/><stop offset="1" stop-color="#E46B7C"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#F2A12B"/>
    </linearGradient>
    <linearGradient id="capSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9851A"/><stop offset="1" stop-color="#B56A0B"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#03302D" stop-opacity=".55"/><stop offset="1" stop-color="#03302D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8941F"/><stop offset="0.5" stop-color="#F6B54C"/><stop offset="1" stop-color="#FFD98C"/>
    </linearGradient>
    <radialGradient id="paw" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E0DC"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <path d="M285 100 H739 A185 185 0 0 1 924 285 V420 Q512 330 100 420 V285 A185 185 0 0 1 285 100 Z" fill="url(#gloss)"/>

  <!-- ears -->
  <path d="M262 420 Q238 200 296 168 Q340 150 452 288 Z" fill="url(#earFur)"/>
  <path d="M762 420 Q786 200 728 168 Q684 150 572 288 Z" fill="url(#earFur)"/>
  <path d="M292 380 Q282 236 312 216 Q338 204 410 296 Z" fill="url(#earIn)"/>
  <path d="M732 380 Q742 236 712 216 Q686 204 614 296 Z" fill="url(#earIn)"/>

  <!-- head -->
  <ellipse cx="512" cy="500" rx="268" ry="228" fill="url(#fur)"/>
  <!-- forehead fluff highlight -->
  <ellipse cx="450" cy="345" rx="120" ry="48" fill="#FFFFFF" opacity=".7"/>

  <!-- blush -->
  <ellipse cx="340" cy="580" rx="62" ry="40" fill="url(#blush)"/>
  <ellipse cx="684" cy="580" rx="62" ry="40" fill="url(#blush)"/>

  <!-- eyes -->
  <ellipse cx="410" cy="500" rx="62" ry="70" fill="#1B2A28"/>
  <ellipse cx="614" cy="500" rx="62" ry="70" fill="#1B2A28"/>
  <ellipse cx="410" cy="506" rx="54" ry="62" fill="url(#irisL)"/>
  <ellipse cx="614" cy="506" rx="54" ry="62" fill="url(#irisR)"/>
  <ellipse cx="410" cy="508" rx="26" ry="40" fill="#142220"/>
  <ellipse cx="614" cy="508" rx="26" ry="40" fill="#142220"/>
  <ellipse cx="428" cy="474" rx="20" ry="23" fill="#FFFFFF"/>
  <ellipse cx="632" cy="474" rx="20" ry="23" fill="#FFFFFF"/>
  <circle cx="392" cy="536" r="9" fill="#FFFFFF" opacity=".9"/>
  <circle cx="596" cy="536" r="9" fill="#FFFFFF" opacity=".9"/>

  <!-- nose and mouth -->
  <path d="M492 566 Q512 558 532 566 Q530 582 512 590 Q494 582 492 566 Z" fill="url(#nose)"/>
  <ellipse cx="506" cy="567" rx="7" ry="3.5" fill="#FFFFFF" opacity=".7"/>
  <path d="M512 590 Q512 612 486 614 Q470 614 466 600 M512 590 Q512 612 538 614 Q554 614 558 600"
        fill="none" stroke="#3C4A48" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- whiskers -->
  <g stroke="#B9C8C4" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M300 548 Q250 538 196 544"/><path d="M302 574 Q250 578 202 594"/>
    <path d="M724 548 Q774 538 828 544"/><path d="M722 574 Q774 578 822 594"/>
  </g>

  <!-- the spacebar the cat peeks over: TypoCat fixes a word when you press Space -->
  <ellipse cx="512" cy="868" rx="340" ry="34" fill="url(#shadow)"/>
  <rect x="206" y="660" width="612" height="200" rx="70" fill="url(#capSide)"/>
  <rect x="206" y="630" width="612" height="190" rx="70" fill="url(#capTop)"/>
  <!-- dished top face -->
  <rect x="246" y="650" width="532" height="132" rx="52" fill="url(#dish)"/>
  <rect x="270" y="640" width="484" height="14" rx="7" fill="#FFFFFF" opacity=".45"/>
  <!-- chin shadow -->
  <ellipse cx="512" cy="654" rx="210" ry="22" fill="#8A4F06" opacity=".22"/>
  <!-- paws on the cap -->
  <ellipse cx="398" cy="652" rx="76" ry="52" fill="url(#paw)"/>
  <ellipse cx="626" cy="652" rx="76" ry="52" fill="url(#paw)"/>
  <g fill="#F59AA0">
    <ellipse cx="372" cy="664" rx="11" ry="9"/><ellipse cx="398" cy="670" rx="11" ry="9"/><ellipse cx="424" cy="664" rx="11" ry="9"/>
    <ellipse cx="600" cy="664" rx="11" ry="9"/><ellipse cx="626" cy="670" rx="11" ry="9"/><ellipse cx="652" cy="664" rx="11" ry="9"/>
  </g>
</svg>
