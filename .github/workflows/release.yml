name: Release

# Push a tag like v0.2.0 to build TypoCat.dmg and attach it to a GitHub release.
# Run it by hand (workflow_dispatch) to build the disk image without releasing it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # A token that can push to hx-natthawat/homebrew-typocat. Without it the cask is bumped by hand.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch word lists
        run: ./scripts/fetch-word-lists.sh

      - name: Self-test
        run: swift build -c release && .build/release/TypoCat --selftest

      # Ad-hoc signed: there's no signing certificate on the runner.
      - name: Build app and disk image
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/build-app.sh
          ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TypoCat-dmg
          path: build/TypoCat.dmg

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section for this version, else the Unreleased one.
          awk -v v="## $version" '$0 ~ "^"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || awk '/^## Unreleased/ {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          Open TypoCat.dmg and drag TypoCat into Applications. The app isn't notarized: the first time, open
          System Settings → Privacy & Security and click Open Anyway, then allow Accessibility when asked.
          After updating, turn TypoCat off and on again in Accessibility (this build is ad-hoc signed).
          NOTES

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/TypoCat.dmg --title "TypoCat ${GITHUB_REF_NAME#v}" --notes-file notes.md

      # Pins the new version and the DMG's checksum in the Homebrew cask.
      - name: Update Homebrew cask
        if: github.ref_type == 'tag' && env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 build/TypoCat.dmg | cut -d' ' -f1)
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/hx-natthawat/homebrew-typocat.git" tap
          sed -i '' -e "s/^  version \".*\"/  version \"$version\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" tap/Casks/typocat.rb
          cd tap
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "TypoCat $version"
          git push -q
